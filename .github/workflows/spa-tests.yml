name: SPA tests

# SPA-side CI: typecheck, lint, token audit, vitest, and production build.
# Every step is enforced. A failing lint, typecheck, token audit, test, or build
# must stop the release rather than leave a green-but-incomplete workflow.

on:
  pull_request:
    paths:
      - 'spa/**'
      - '.github/workflows/spa-tests.yml'
  push:
    branches: [main]
    paths:
      - 'spa/**'
      # Symmetry with pull_request above, and with api-tests.yml: a push that
      # changes only this workflow must still run it. See F-043.
      - '.github/workflows/spa-tests.yml'

permissions:
  contents: read

jobs:
  # The accessibility gate is the one e2e spec CI runs: it is fast (~25s), needs
  # no backend (the suite mocks every API call), and it is the difference
  # between "WCAG 2.2 AA" being a claim and a check. The full e2e suite stays a
  # local/pre-release run — 51 specs against a dev server is not a per-push cost.
  a11y:
    name: Accessibility gate (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps firefox

      - name: Accessibility gate (enforced)
        run: npm run test:a11y

  # W1.2 — the visual baseline gate. 16 committed PNGs of the shared component
  # kit, compared against the gallery at 1280 and 390. It lives beside the a11y
  # job because it is the same kind of check: a browser, a fixed config, no
  # backend (the suite mocks every API call) — and it is the only gate that can
  # see a primitive change its size or lose a border.
  #
  # Run on the same Firefox/Ubuntu the baselines were generated on. The
  # snapshots are committed without a platform suffix
  # (`playwright.config.ts → snapshotPathTemplate`), so a run on a different
  # platform is a re-baseline, not a silent new file.
  gallery:
    name: Visual baselines (component gallery)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps firefox

      - name: Visual baselines (enforced)
        run: npm run test:gallery

      - name: Upload the diff images when a baseline moves
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diffs
          path: |
            spa/test-results/**/*-actual.png
            spa/test-results/**/*-diff.png
          retention-days: 7
          if-no-files-found: ignore

  vitest:
    name: Typecheck · Lint · Vitest · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Lint (enforced)
        run: npm run lint

      - name: Typecheck (enforced)
        run: npm run typecheck

      - name: Typecheck E2E specs (enforced)
        # tsconfig.json includes only src/ and vite.config.ts, so the 51
        # Playwright specs were never typechecked — a latent `.map` on an
        # AxeResults object in the a11y control only failed when the suite ran.
        # This is the missing half, and it found 8 errors on the day it was added.
        run: npm run typecheck:e2e

      - name: Token discipline (enforced)
        # The Atelier rebrand works because every colour resolves through a
        # token in src/styles/tokens.css — that is what let 355 pages restyle
        # without being edited. This blocks a hex literal or raw Tailwind
        # palette class from creeping back in.
        run: npm run audit:tokens

      - name: Layout discipline (enforced)
        env:
          LAYOUT_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$LAYOUT_AUDIT_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$LAYOUT_AUDIT_BASE_SHA"
          fi
          npm run audit:layout

      - name: Vitest
        env:
          CI: 'true'
        # --passWithNoTests so a clean tree (no specs yet on a sub-tree) is not a failure;
        # vitest still exits non-zero on any actual failed assertion.
        run: npm test -- --run --passWithNoTests

      - name: Production build (enforced)
        # Keep the release artifact on the same path developers use locally:
        # TypeScript must compile before Vite emits the bundle.
        run: npm run build

      - name: Bundle budget (enforced)
        # Sizes are measured on the artifact the previous step just produced, and
        # gzipped — what the network actually carries. Budgets live in
        # scripts/bundle-budget.json with the reasoning for each number.
        run: npm run audit:bundle
