name: SPA tests

# SPA-side CI: typecheck, lint, token audit, vitest, and production build.
# Every step is enforced. A failing lint, typecheck, token audit, test, or build
# must stop the release rather than leave a green-but-incomplete workflow.

on:
  pull_request:
    paths:
      - 'spa/**'
      - '.github/workflows/spa-tests.yml'
  push:
    branches: [main]
    paths:
      - 'spa/**'

permissions:
  contents: read

jobs:
  vitest:
    name: Typecheck · Lint · Vitest · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (enforced)
        run: npm run lint

      - name: Typecheck (enforced)
        run: npm run typecheck

      - name: Token discipline (enforced)
        # The Atelier rebrand works because every colour resolves through a
        # token in src/styles/tokens.css — that is what let 355 pages restyle
        # without being edited. This blocks a hex literal or raw Tailwind
        # palette class from creeping back in.
        run: npm run audit:tokens

      - name: Vitest
        env:
          CI: 'true'
        # --passWithNoTests so a clean tree (no specs yet on a sub-tree) is not a failure;
        # vitest still exits non-zero on any actual failed assertion.
        run: npm test -- --run --passWithNoTests

      - name: Production build (enforced)
        # Keep the release artifact on the same path developers use locally:
        # TypeScript must compile before Vite emits the bundle.
        run: npm run build
