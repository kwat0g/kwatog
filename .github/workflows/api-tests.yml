name: API tests

# Backend CI: syntax, dependency metadata, PHPStan, and the Laravel PHPUnit
# suite. SPA checks run in the companion workflow.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      # The workflow's own file must retrigger it on push, not only on PR.
      # Without this, a commit that fixes this workflow and touches nothing
      # under api/ does not run it — so the fix cannot be observed. That is
      # exactly how F-043 hid: the job had never executed its suite, and the
      # first attempt to prove the fix silently did not trigger.
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP quality + PHPUnit (Laravel 12 / PHP 8.3 / PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ogami_test
          POSTGRES_USER: ogami
          POSTGRES_PASSWORD: ogami_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogami -d ogami_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: api

    # APP_ENV must be set for EVERY step, not just the PHPUnit one. api/.env is
    # untracked, so in CI `config('app.env')` falls back to its
    # `env('APP_ENV', 'production')` default (api/config/app.php). That makes
    # ProductionAssertions::assertSafeOrFail() fire (AppServiceProvider.php:185)
    # on any step that boots the framework — and two steps do:
    #   * `composer install --optimize-autoloader` runs the post-autoload-dump
    #     hook `artisan package:discover`, which boots the app;
    #   * larastan's bootstrap boots the kernel for `phpstan analyse`.
    # Both then die on "Production boot blocked: HASHIDS_SALT must be set to a
    # non-default value ...". The guard is correct — it is catching a
    # production-shaped boot — so the environment is what needs fixing, not the
    # assertion. Job scope covers both steps; the PHPUnit step's own env block
    # re-declares APP_ENV harmlessly. See finding F-043.
    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, mbstring, intl, gd, zip, redis
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP files (parallel syntax check)
        run: |
          find app database tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse app --memory-limit=1G

      - name: Run PHPUnit
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ogami_test
          DB_USERNAME: ogami
          DB_PASSWORD: ogami_ci_pw
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit --colors=always
