name: API tests

# Backend CI: syntax, dependency metadata, PHPStan, and the Laravel PHPUnit
# suite. SPA checks run in the companion workflow.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      # The workflow's own file must retrigger it on push, not only on PR.
      # Without this, a commit that fixes this workflow and touches nothing
      # under api/ does not run it — so the fix cannot be observed. That is
      # exactly how F-043 hid: the job had never executed its suite, and the
      # first attempt to prove the fix silently did not trigger.
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP quality + PHPUnit (Laravel 12 / PHP 8.3 / PostgreSQL + Redis)
    runs-on: ubuntu-latest
    # Calibrated against a real run, not a guess. Before F-043 the job died
    # at `composer install` in ~41s, so this cap had never been exercised by a
    # run that reached PHPUnit. The first one that did was cancelled at 20m21s
    # with the suite still going: setup + install + audit + lint + PHPStan take
    # ~2 min, then 1,772 tests need ~18-21 min on a GitHub-hosted runner versus
    # ~14.8 min locally. 35 leaves headroom for runner variance and suite growth
    # while still failing fast on a genuine hang.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ogami_test
          POSTGRES_USER: ogami
          POSTGRES_PASSWORD: ogami_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogami -d ogami_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: api

    # This block must be JOB-scoped, not step-scoped. api/.env and
    # api/.env.testing are both untracked, so in CI no env file is loaded at all
    # and every value falls back to its config/*.php default. Any step that
    # boots the framework then boots with production-shaped defaults — and two
    # steps do:
    #   * `composer install --optimize-autoloader` runs the post-autoload-dump
    #     hook `artisan package:discover`, which boots the app;
    #   * larastan's bootstrap boots the kernel for `phpstan analyse`.
    # Concretely, before this block existed: APP_ENV defaulted to 'production'
    # (api/config/app.php:5) so ProductionAssertions::assertSafeOrFail() threw
    # (AppServiceProvider.php:185), and BROADCAST_CONNECTION defaulted to
    # 'reverb' (api/config/broadcasting.php:31) so boot tried to build a Pusher
    # client with a null REVERB_APP_KEY. Both killed `composer install`, which is
    # why PHPStan and PHPUnit had never once executed in CI. See finding F-043.
    #
    # SCOPE OF THIS BLOCK, and what "in step with api/phpunit.xml" means.
    # Narrowed 2026-08-19: the previous two lines said this block mirrors
    # api/phpunit.xml's <env> block and that the two must be kept in step,
    # without saying which keys. They are 24 keys apart and always were, so
    # read literally the instruction asks for a mirror that would be wrong.
    #
    # This block exists for the steps that boot the framework BEFORE PHPUnit
    # runs, which PHPUnit's own <env> cannot reach: `composer install
    # --optimize-autoloader` (its post-autoload-dump hook runs `artisan
    # package:discover`) and larastan's kernel bootstrap. Neither runs a
    # migration or a seeder. So the keys that belong here are exactly the
    # framework-boot tier:
    #   * APP_ENV, APP_KEY -- environment selection and the encrypter
    #   * DB_*, REDIS_*    -- connection coordinates
    #   * CACHE_STORE, SESSION_DRIVER, QUEUE_CONNECTION, MAIL_MAILER,
    #     BROADCAST_CONNECTION -- drivers a boot may resolve
    # Those are the keys to keep in step with api/phpunit.xml, and "in step"
    # means the same DRIVER choice, not the same literal. DB_HOST (127.0.0.1
    # here, `db` there) and DB_PASSWORD (ogami_ci_pw vs ogami_dev_pw) are
    # deliberately DIFFERENT: a GitHub runner's service containers are not
    # Compose's. That divergence is precisely why those phpunit.xml entries
    # carry no force="true" -- CI must be able to outrank the file. See F-042.
    # BROADCAST_CONNECTION is the cautionary case in this tier: it read 'null'
    # in phpunit.xml and 'log' here and the two silently disagreed, which is
    # what a real "keep in step" instruction is for.
    #
    # The remaining keys in api/phpunit.xml (24 as of 2026-08-19) are
    # PHPUnit-only and must NOT be mirrored here: the SettingsSeeder inputs
    # (COMPANY_*, ADMIN_*, QUALITY_COC_*, ACCOUNTING_FUNCTIONAL_CURRENCY_CODE,
    # TAX_PH_VAT_RATE, PDF_FOOTER_DISCLAIMER) plus two test-only tunings
    # (BCRYPT_ROUNDS, TELESCOPE_ENABLED). No step governed by this block runs a
    # seeder, so copying them here would be cargo cult -- maintenance surface
    # for values nothing in this tier reads. phpunit.xml is their single home,
    # and since a <php><env> entry is applied before Laravel's immutable
    # Dotenv it already outranks every env file on every machine, which is the
    # remedy F-042 actually landed.
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ogami_test
      DB_USERNAME: ogami
      DB_PASSWORD: ogami_ci_pw
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # 'log', not 'null': Laravel's env() converts the literal string "null"
      # to PHP null, which would leave broadcasting.default unset and fail on
      # resolution rather than selecting the 'null' connection. 'log' is a real
      # connection (api/config/broadcasting.php:90) needing no credentials.
      BROADCAST_CONNECTION: log
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, mbstring, intl, gd, zip, redis
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP files (parallel syntax check)
        run: |
          find app database tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse app --memory-limit=1G

      - name: Run PHPUnit
        # Environment comes from the job-scoped env block above, which every
        # framework-booting step needs. Do not reintroduce a step-scoped copy:
        # a second declaration is what let the two earlier steps boot with
        # production defaults for as long as they did (F-043).
        run: vendor/bin/phpunit --colors=always
