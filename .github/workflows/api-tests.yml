name: API tests

# Backend CI: syntax, dependency metadata, PHPStan, and the Laravel PHPUnit
# suite. SPA checks run in the companion workflow.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP quality + PHPUnit (Laravel 12 / PHP 8.3 / PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ogami_test
          POSTGRES_USER: ogami
          POSTGRES_PASSWORD: ogami_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogami -d ogami_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, mbstring, intl, gd, zip, redis
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP files (parallel syntax check)
        run: |
          find app database tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse app --memory-limit=1G

      - name: Run PHPUnit
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ogami_test
          DB_USERNAME: ogami
          DB_PASSWORD: ogami_ci_pw
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit --colors=always
