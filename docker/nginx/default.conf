# Query values and referrers can carry tokens. Log path only.
log_format safe_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    access_log /var/log/nginx/access.log safe_no_query;

    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50M;

    # Re-resolve Docker service names instead of pinning the IP at startup.
    # Containers are recreated with a new IP; a startup-only lookup leaves
    # nginx pointing at a dead address (502s) until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $spa_upstream spa:5173;
    set $reverb_upstream reverb:8080;

    # Where Laravel's public/ lives (mounted via the api volume).
    root /var/www/public;
    index index.php;

    # Security headers (per CLAUDE.md) — shared include so locations that
    # declare their own add_header can re-assert the full set.
    include /etc/nginx/security-headers-dev.conf;

    # ─── WebSocket (Laravel Reverb) ─────────────────────────
    location /ws {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ─── Inline document view (PdfPreviewModal iframe) ──────
    # PdfPreviewModal iframes this same-origin URL; DENY/frame-ancestors 'none'
    # would make the browser refuse to render it, so this location declares its
    # own full header set (headers can't be overridden once added — duplicates
    # are both sent — hence no include of the generic file here).
    # Must appear BEFORE the general api regex location: regex locations are
    # evaluated in order and the first match wins.
    location ~ ^/api/v1/documents/[^/]+/view$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss: http://localhost:* ws://localhost:*; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        fastcgi_hide_header X-Powered-By;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ─── Laravel API + Sanctum CSRF ─────────────────────────
    # Always pass through to PHP-FPM via index.php; Laravel's router handles paths.
    location ~ ^/(api|sanctum)/ {
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ─── Laravel-served storage (uploaded files) ────────────
    location /storage/ {
        try_files $uri =404;
    }

    # ─── Vite dev server (SPA + HMR) — everything else ──────
    location / {
        proxy_pass http://$spa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
