# ─────────────────────────────────────────────────────────────────────────────
# Dev stack, served over TLS on a public hostname (remote-coding setup).
#
# Derived from docker/nginx/default.conf — same routing, plus:
#   • TLS on 443 using the existing Let's Encrypt cert for ogamiph.dev
#   • port 80 kept for the ACME http-01 challenge + redirect (cert renewal
#     breaks silently otherwise; the prod conf mounted /var/www/certbot for
#     exactly this reason)
#   • /_term/ → ttyd over a UNIX socket, so the web terminal is never bound
#     to a network interface and cannot be reached except through this proxy
#
# Everything else — /ws, the inline-document location, /api|/sanctum, /storage/,
# and / → Vite — is byte-identical to default.conf. Keep them in sync.
# ─────────────────────────────────────────────────────────────────────────────

# ttyd listens on a UNIX socket (see systemd/ttyd.service). No TCP port, so no
# firewall rule and no exposure if this proxy is ever bypassed.
upstream ttyd_sock {
    server unix:/run/ttyd/ttyd.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name ogamiph.dev;

    # Must stay reachable on plain HTTP or certbot renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Do not reflect an attacker-controlled Host header into the redirect
        # (same hardening as prod.conf). This conf is domain-specific anyway.
        return 301 https://ogamiph.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ogamiph.dev;

    client_max_body_size 50M;

    # Where Laravel's public/ lives (mounted via the api volume).
    root /var/www/public;
    index index.php;

    # ─── TLS ────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ogamiph.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogamiph.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (per CLAUDE.md) — shared include so locations that
    # declare their own add_header can re-assert the full set.
    include /etc/nginx/security-headers-dev.conf;

    # ─── Web terminal (ttyd → tmux) ─────────────────────────────
    # nginx replaces, never merges, inherited add_header directives in a
    # location block, so the shared include above does not apply here. That is
    # deliberate: ttyd ships its own inline bundle and the dev CSP would fight
    # it. This location is credential-gated by ttyd itself (--credential).
    location /_term/ {
        proxy_pass http://ttyd_sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A shell session is idle for long stretches while you read code.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ─── WebSocket (Laravel Reverb) ─────────────────────────────
    location /ws {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ─── Inline document view (PdfPreviewModal iframe) ──────────
    # Declares its own full header set — see default.conf for why.
    location ~ ^/api/v1/documents/[^/]+/view$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ─── Laravel API + Sanctum CSRF ─────────────────────────────
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ─── Laravel-served storage (uploaded files) ────────────────
    location /storage/ {
        try_files $uri =404;
    }

    # ─── Vite dev server (SPA + HMR) — everything else ──────────
    # The Upgrade/Connection headers here are what carry the HMR WebSocket.
    location / {
        proxy_pass http://spa:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
