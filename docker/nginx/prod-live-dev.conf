# ─── Ogami ERP — Production Nginx ─────────────────────────────────────────
# HTTPS on 443 (Let's Encrypt certs from the host's /etc/letsencrypt).
# Plain HTTP on 80 redirects everything to HTTPS, except .well-known/acme-challenge
# which Certbot uses for renewal.
# ──────────────────────────────────────────────────────────────────────────

# Query values and referrers can carry tokens. Log path only.
log_format safe_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

# Forward WebSocket upgrades to Vite's HMR endpoint on this same HTTPS host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect, plus ACME challenge passthrough ────────────────
server {
    access_log /var/log/nginx/access.log safe_no_query;

    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Do not reflect an attacker-controlled Host header in the redirect.
        # SERVER_NAME is substituted from the deployment environment.
        return 301 https://${SERVER_NAME}$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────
server {
    access_log /var/log/nginx/access.log safe_no_query;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SERVER_NAME};
    server_tokens off;

    client_max_body_size 50M;

    # ── TLS ───────────────────────────────────────────────────────────────
    # Replace SERVER_NAME with the actual domain at deploy time. The
    # docs/DEPLOY.md runbook uses `envsubst` during `make deploy`.
    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    # Mozilla Intermediate (https://ssl-config.mozilla.org/)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    # Docker's embedded DNS: re-resolve service names every 10s instead of
    # pinning container IPs at startup (recreated containers get new IPs).
    resolver            127.0.0.11 valid=10s ipv6=off;
    resolver_timeout    5s;
    set $api_upstream api-live-dev:9000;
    set $reverb_upstream reverb:8080;
    set $spa_upstream live-spa:5173;

    # ── Security headers (per CLAUDE.md) — shared include so locations that
    # declare their own add_header can re-assert the full set. ───────────────
    include /etc/nginx/security-headers-prod.conf;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── WebSocket + events (Laravel Reverb / Pusher protocol) ─────────────
    # pusher-js connects the browser to /app/{key} (WebSocket upgrade) and the
    # server-side broadcaster posts to /apps/{id}/events. Both must reach the
    # Reverb container. (The old /ws path was never requested by pusher-js.)
    location ~ ^/(app|apps)/ {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
    }

    # ── Inline document view (PdfPreviewModal iframe) ─────────────────────
    # PdfPreviewModal iframes this same-origin URL; DENY/frame-ancestors 'none'
    # would make the browser refuse to render it, so this location declares its
    # own full header set (headers can't be overridden once added — duplicates
    # are both sent — hence no include of the generic file here).
    # Must appear BEFORE the general api regex location: regex locations are
    # evaluated in order and the first match wins.
    location ~ ^/api/v1/documents/[^/]+/view$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), clipboard-write=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' wss://$host wss://$host:8080; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        fastcgi_hide_header X-Powered-By;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_URI    /index.php;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           on;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ── Laravel API + Sanctum CSRF ────────────────────────────────────────
    location ~ ^/(api|sanctum)/ {
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_URI    /index.php;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           on;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ── Storage downloads ─────────────────────────────────────────────────
    # All file downloads MUST go through Laravel controllers for permission
    # enforcement (DocumentController, DeliveryProofController, payroll
    # disbursement proofs, etc.). The public /storage/ symlink + fallback
    # block was a perm-bypass risk; removed in Phase 4. If a future feature
    # needs unauthenticated public assets, add a narrow location matching
    # only that path, not a blanket /storage/.

    # ── SPA static build with client-side routing fallback ────────────────
    root /var/www/spa;
    index index.html;

    # ── Sitemap ───────────────────────────────────────────────────────────
    # Generated here (not a static file) so the absolute <loc> URLs use the
    # real deployment host without baking the domain in at build time.
    # Crawl rules live in spa/public/robots.txt; only / and /careers are
    # indexable. Career detail pages are dynamic and intentionally omitted.
    location = /sitemap.xml {
        default_type application/xml;
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url><loc>$scheme://$host/</loc><changefreq>monthly</changefreq><priority>1.0</priority></url>\n  <url><loc>$scheme://$host/careers</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>\n</urlset>\n";
    }

    # PDF.js ships its module worker as .mjs. The base image's mime.types does
    # not map that extension, and module workers reject application/octet-stream.
    # Serve these hashed modules with JavaScript MIME while preserving the same
    # cache and security headers as the rest of the Vite assets.
    location ~* ^/assets/.*\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 365d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers-prod.conf;
    }

    # Long-cache hashed Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        # add_header here drops all server-level headers; re-assert them.
        include /etc/nginx/security-headers-prod.conf;
    }

    location = /index.html {
        return 302 /;
    }

    # The service-worker script is checked on each build-specific registration.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/security-headers-prod.conf;
    }

    # Public build metadata is checked by active SPAs so users can reload
    # after deployment. It contains no user data and must never be cached.
    location = /version.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/security-headers-prod.conf;
    }

    location / {
        # Development mode serves the source-mounted Vite app. Keep all SPA
        # APIs above on the production Laravel app and its existing database.
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_spa_fallback;
        proxy_pass http://$spa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # Vite's React Fast Refresh injects a tiny inline module preamble. Keep
        # every other production security header while allowing that dev-only
        # script; the API routes retain the strict production CSP above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), clipboard-write=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' wss://$host wss://$host:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    location @static_spa_fallback {
        try_files $uri $uri/ /index.html;
    }
}
