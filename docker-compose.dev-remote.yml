# ─────────────────────────────────────────────────────────────────────────────
# Overlay: run the DEV stack (docker-compose.yml) on the public hostname
# ogamiph.dev over TLS, so the whole thing is editable from a browser at an
# internet cafe with no local setup.
#
#   docker compose -f docker-compose.yml \
#                  -f ../ogami-remote-dev/compose/docker-compose.dev-remote.yml up -d
#
# (in practice this file gets copied to the repo root — see the runbook)
#
# What it changes vs the base dev compose:
#   • nginx publishes 443 as well as 80, mounts the Let's Encrypt certs and the
#     ACME webroot, swaps in nginx/dev-remote.conf, and gets the ttyd socket
#   • spa points HMR at wss://ogamiph.dev:443 instead of ws://localhost:80
#   • api runs with APP_DEBUG on, which is only acceptable because this
#     database holds seed data only — see the runbook's warning
#
# Compose merges `volumes` by target path, so re-declaring
# /etc/nginx/conf.d/default.conf replaces the base mount rather than
# duplicating it.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    environment:
      - APP_ENV=local
      # Stack traces render .env values. Fine on seed data, never on real data.
      - APP_DEBUG=true
    # The image's php-fpm runs as uid 1000 ("www"), which on this host is the
    # OTHER human account (reymarkbungubung) — the exact ownership confusion
    # this whole setup exists to avoid. Rather than override `user:` (php-fpm
    # needs to start as root to setuid its pool), grant the container kwat0g's
    # group (gid 1004) so it can read .env and write storage/ on files that
    # stay owned by kwat0g on the host.
    group_add: ["1004"]

  queue:
    group_add: ["1004"]

  reverb:
    group_add: ["1004"]

  spa:
    environment:
      # Browser connects its HMR socket to the public origin, not Vite's
      # internal 5173. protocol must be wss: a page served over HTTPS refuses
      # a plaintext ws:// connection as mixed content.
      - VITE_HMR_PROTOCOL=wss
      - VITE_HMR_HOST=ogamiph.dev
      - VITE_HMR_PORT=443
      # Vite 7 rejects requests whose Host header it does not recognise.
      - VITE_ALLOWED_HOSTS=ogamiph.dev
      # Reverb through the /ws proxy on the TLS origin.
      - VITE_REVERB_HOST=ogamiph.dev
      - VITE_REVERB_PORT=443
      - VITE_REVERB_SCHEME=https

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api:/var/www
      - ./docker/nginx/dev-remote.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers-dev.conf:/etc/nginx/security-headers-dev.conf:ro
      # Certs are provisioned on the host by certbot; renewal writes here.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # ttyd's UNIX socket. Read-write: nginx must connect() to it.
      - /run/ttyd:/run/ttyd

  # Reverb is left exactly as the base compose has it: bound to 127.0.0.1:8080
  # on the host, which is harmless and unreachable from outside. The browser
  # reaches Reverb through the /ws proxy on 443 instead, so there is nothing to
  # publish and no need for a `!reset` override (that tag needs Compose 2.24+).
