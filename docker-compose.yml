services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ogami-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
      - ./scripts:/var/www/scripts:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      # Fail closed by default. Set APP_DEBUG=true explicitly for local
      # debugging; never inherit a debug-enabled default into a shared host.
      - APP_DEBUG=${APP_DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ogami-net]

  spa:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ogami-spa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./spa:/app
      # Audit scripts are kept at repository root and invoked by the SPA
      # package scripts as ../scripts/*. Mount read-only; audits only inspect
      # source files and browser/API state.
      - ./scripts:/scripts:ro
      # Root-relative audit scripts also inspect the SPA source at /spa.
      - ./spa:/spa:ro
      # SPA contract tests read the backend notification catalog so frontend
      # metadata cannot drift from the API's canonical type list. Keep the
      # source mount read-only; the SPA container only needs it for inspection.
      - ./api:/api:ro
      - spa_node_modules:/app/node_modules
    environment:
      # Forwarded so vite.config.ts can rewire HMR through the Nginx proxy.
      - VITE_HMR_HOST=${VITE_HMR_HOST:-localhost}
      - VITE_HMR_PORT=${VITE_HMR_PORT:-${NGINX_PORT:-80}}
      - VITE_HMR_PROTOCOL=${VITE_HMR_PROTOCOL:-ws}
      - NGINX_PORT=${NGINX_PORT:-80}
      # Reverb / WebSocket — must match REVERB_APP_KEY in the API .env.
      # Host blank => browser uses its own hostname; port must match
      # REVERB_HOST_PORT below since pusher-js cannot use a path prefix.
      - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-ogami_reverb}
      - VITE_REVERB_HOST=${VITE_REVERB_HOST:-}
      - VITE_REVERB_PORT=${VITE_REVERB_PORT:-${REVERB_HOST_PORT:-8080}}
      - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME:-http}
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    networks: [ogami-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ogami-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Outside conf.d/ on purpose: nginx.conf wildcard-includes conf.d/*.conf
      # at http level, which would apply these headers twice.
      - ./docker/nginx/security-headers-dev.conf:/etc/nginx/security-headers-dev.conf:ro
    depends_on:
      - api
      - spa
      - reverb
    networks: [ogami-net]

  db:
    image: postgres:16-alpine
    container_name: ogami-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ogami}
      POSTGRES_USER: ${DB_USERNAME:-ogami}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ogami_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ogami}"]
      # Crash-recovery after an abrupt VM shutdown can fsync a large data dir
      # for several minutes while connections are rejected. A 15-minute grace
      # period keeps that window from counting against retries (otherwise
      # `make up` can fail with "container ogami-db is unhealthy" mid-recovery).
      start_period: 15m
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ogami-net]

  redis:
    image: redis:7-alpine
    container_name: ogami-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [ogami-net]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ogami-reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
      - ./scripts:/var/www/scripts:ro
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      # Browser connects directly via ws://<host>:8080/app/<key>.
      # pusher-js does not support a path prefix, so we cannot proxy
      # this through Nginx — the Reverb port must be reachable.
      # Keep the development WebSocket endpoint local by default. Override
      # REVERB_HOST_BIND only when a trusted external browser must connect.
      - "${REVERB_HOST_BIND:-127.0.0.1}:${REVERB_HOST_PORT:-8080}:8080"
    depends_on:
      - api
    networks: [ogami-net]

  # One Horizon master, five lanes (api/config/horizon.php):
  #   high · default · mail · automation · bulk
  #
  # This replaces two `queue:work` containers. Those were one process per lane
  # and `--queue=high,default` is serial: priority chose what the single worker
  # picked NEXT, not what it interrupted, so any slow listener delayed every
  # high job. Mail also shared `default` with approvals, and backup shared `low`
  # with MRP and payroll. Horizon gives each lane its own pool, its own
  # timeout/lease, and wait-time autoscaling.
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ogami-horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
      - ./scripts:/var/www/scripts:ro
    command: php artisan horizon
    # A worker finishes the job it holds; let it drain instead of SIGKILLing a
    # running payroll computation or backup.
    stop_grace_period: 60s
    depends_on:
      - api
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [ogami-net]

networks:
  ogami-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  spa_node_modules:
