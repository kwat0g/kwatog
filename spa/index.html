<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Manufacturing operations and enterprise resource planning" />

    <!-- Public marketing/careers surface only. The ERP itself is auth-only and
         excluded via robots.txt. Social scrapers do not run JS, so these base
         tags are static; src/hooks/useSeo.ts refines title/description/canonical
         at runtime for crawlers that render. Replace og:image with a 1200x630
         banner when one exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ogami ERP" />
    <meta property="og:title" content="Ogami ERP" />
    <meta property="og:description" content="Manufacturing operations and enterprise resource planning" />
    <meta property="og:image" content="/ogami-icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ogami ERP" />
    <meta name="twitter:description" content="Manufacturing operations and enterprise resource planning" />
    <meta name="twitter:image" content="/ogami-icon-512.png" />
    <!--
      Canonical CSP is enforced via nginx headers. This meta tag is defense-in-depth
      for misconfigured static hosting / dev servers. It intentionally omits
      frame-ancestors (only valid in headers) and matches the prod nginx policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:;"
    />

    <!-- Atelier typefaces (Instrument Serif / Public Sans / Spline Sans Mono) are
         self-hosted via @fontsource and bundled by Vite — imported in src/main.tsx,
         so they are served from our own origin and satisfy `font-src 'self'`. -->

    <!-- PWA manifests — each sub-app has its own; sw-register.ts picks the right
         manifest at runtime based on URL path. The default link below is the
         factory/shop-floor manifest; it is swapped via JS for /driver paths. -->
    <link rel="manifest" href="/factory-manifest.webmanifest" />
    <meta name="theme-color" content="#fdfcfa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ERP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Ogami ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
