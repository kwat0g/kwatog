<!--
  Ogami Driver mark — the floor-palette variant.

  The driver and factory PWAs render under [data-theme="floor"], so their
  home-screen icon and splash use the floor canvas (#0d0b08) and the
  safety-orange accent (#ff8a4c) rather than the office paper/clay. An icon in
  office colours would flash a warm-paper splash before a near-black app.

  Geometry is identical to mark.svg — see that file for how the glyph outline
  was extracted and how the transform is derived.

  Regenerate rasters with: node scripts/build-brand-assets.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ogami Driver">
  <rect width="512" height="512" fill="#0d0b08"/>
  <g transform="translate(118.3,439.85) scale(0.51,-0.51)">
