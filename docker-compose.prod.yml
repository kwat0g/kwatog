# ─── Ogami ERP — Production Compose ───────────────────────────────────────
# Used on the production VPS (DigitalOcean droplet, Ubuntu 22.04 LTS).
# Differences vs docker-compose.yml (dev):
#   • SPA is built into static files at deploy time, then mounted into nginx
#     (no Vite dev server, no HMR).
#   • API uses Dockerfile.prod (multi-stage, --no-dev, opcache enabled).
#   • Nginx terminates TLS via Let's Encrypt certs mounted from the host.
#   • All database/redis/meilisearch ports stay internal-only.
#   • Email delivery uses an external SMTP provider configured via env.
#
# Deploy: see docs/DEPLOY.md.
# ────────────────────────────────────────────────────────────────────────────

services:
  # Run schema changes as a one-shot dependency. API/queue/scheduler consumers
  # cannot start until this exits successfully, so a direct `compose up` cannot
  # accidentally expose a new image against an old schema.
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ogami-migrate
    restart: "no"
    working_dir: /var/www
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    command: php artisan migrate --force --no-interaction
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appstorage:/var/www/storage/app
    networks: [ogami-net]

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ogami-api
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - appstorage:/var/www/storage/app
    networks: [ogami-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ogami-nginx
    restart: unless-stopped
    environment:
      # The official Nginx entrypoint expands this into the mounted template.
      # ProductionAssertions applies the same fail-closed requirement to the
      # API/worker processes, so a missing host cannot look deployable.
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      # Outside conf.d/ on purpose: nginx.conf wildcard-includes conf.d/*.conf
      # at http level, which would apply these headers twice.
      - ./docker/nginx/security-headers-prod.conf:/etc/nginx/security-headers-prod.conf:ro
      # SPA static build (produced by `make build-spa` / Makefile target).
      - ./spa/dist:/var/www/spa:ro
      # Let's Encrypt certs — provisioned on the host with certbot.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    networks: [ogami-net]

  db:
    image: postgres:16-alpine
    container_name: ogami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Host cron/restore runbook path. The backup script is read-only; dumps
      # survive db-container replacement on the VPS.
      - ./scripts:/opt/scripts:ro
      - /var/backups/ogami:/var/backups/ogami
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [ogami-net]

  redis:
    image: redis:7-alpine
    container_name: ogami-redis
    restart: unless-stopped
    # Phase 4 — AOF persistence so a Redis crash doesn't wipe sessions,
    # cache (incl. permission/role keys), or queued jobs. Snapshots still
    # run by default; appendonly is the bounded-loss layer on top.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [ogami-net]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: ogami-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    networks: [ogami-net]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ogami-reverb
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - api
    volumes:
      - appstorage:/var/www/storage/app
    networks: [ogami-net]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ogami-queue
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    # 1800s matches the longest durable listener; retry_after is kept above it
    # so Redis does not redeliver a live long-running job.
    command: php artisan queue:work --tries=3 --timeout=1800 --sleep=3
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - appstorage:/var/www/storage/app
    networks: [ogami-net]

  # Phase 4 — Scheduler. routes/console.php registers daily/hourly jobs
  # (mrp:run-daily, alerts:run, payroll:auto-create-period,
  # maintenance:request-preventive-generation, etc.). Without this container, none
  # of those cron-style tasks ever fire in production.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ogami-scheduler
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    # Run one truthful scheduler tick every 60s. The wrapper observes
    # ScheduledTaskFailed because Laravel's native schedule:run catches task
    # exceptions and otherwise exits 0; a failed tick must restart this
    # container so the next process can retry the schedule.
    command: sh -c 'set -eu; while true; do php artisan schedule:run-fail-fast --no-interaction; sleep 60; done'
    healthcheck:
      # A loop can remain alive while a task is wedged. The durable heartbeat
      # probe catches that state so Docker/orchestration can surface or
      # restart the unhealthy scheduler independently of its own loop.
      test: ["CMD-SHELL", "php artisan scheduler:health --stale-minutes=15 --no-interaction >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - appstorage:/var/www/storage/app
    networks: [ogami-net]

networks:
  ogami-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  meilidata:
  appstorage:
